[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-ml"
version = "0.1.0"
description = "Détection de fraude/anomalie sur compteurs : features DW + étiquettes inspections"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",            # modèle + métriques
    "joblib>=1.3",                  # sauvegarde du modèle entraîné
    "psycopg[binary]>=3.1",         # lecture du Data Warehouse (features)
    "pymongo>=4.6",                 # lecture des inspections (étiquettes)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ml-train = "ml.train:main"
ml-score = "ml.score:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
