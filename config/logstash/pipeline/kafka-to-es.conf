# =============================================================================
#  Pipeline Logstash : Kafka -> Elasticsearch
# =============================================================================
#  Logstash est le 3e lecteur des topics Kafka (après les consumers Redis et
#  Mongo). Grâce aux groupes Kafka, il reçoit l'INTÉGRALITÉ du flux sans priver
#  les autres. Son rôle : indexer chaque message dans Elasticsearch pour que
#  Kibana puisse le chercher et le visualiser.
#
#  Un pipeline Logstash a trois sections : input (d'où ça vient), filter (quoi en
#  faire), output (où ça va).
# =============================================================================

input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}"
    # On s'abonne aux DEUX topics d'un coup. On distinguera à l'indexation via
    # la métadonnée du topic (voir decorate_events + output).
    topics => ["meter-readings", "meter-alerts"]
    # Groupe DÉDIÉ à Logstash : indépendant des groupes des consumers Redis/Mongo.
    group_id => "elk-logstash"
    # Au premier démarrage, repartir du début du flux (ne rien rater).
    auto_offset_reset => "earliest"
    # Le message Kafka est du JSON : on le décode directement en champs.
    codec => json
    # "basic" expose des métadonnées, dont [@metadata][kafka][topic] : on s'en
    # sert pour router chaque message vers le bon index Elasticsearch.
    decorate_events => "basic"
  }
}

filter {
  # Traduire le nom du topic Kafka en une base d'index parlante et francophone :
  #   meter-readings -> releves      meter-alerts -> alertes
  if [@metadata][kafka][topic] == "meter-readings" {
    mutate { add_field => { "[@metadata][index_base]" => "releves" } }
  } else if [@metadata][kafka][topic] == "meter-alerts" {
    mutate { add_field => { "[@metadata][index_base]" => "alertes" } }
  } else {
    # Filet de sécurité : un topic inattendu part dans un index "autres".
    mutate { add_field => { "[@metadata][index_base]" => "autres" } }
  }

  # L'horodatage métier (celui du relevé/alerte) devient la référence temporelle
  # de l'événement dans Elasticsearch : les graphes Kibana s'alignent sur l'heure
  # RÉELLE de la mesure, pas sur l'heure d'ingestion.
  date {
    match => ["horodatage", "ISO8601"]
    target => "@timestamp"
  }
  # On retire la date d'origine désormais redondante (gardée dans @timestamp).
  mutate {
    remove_field => ["horodatage", "event"]
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    # Index nommé d'après le topic + la date du jour :
    #   meter-readings -> index "releves-2026.10.26"
    #   meter-alerts   -> index "alertes-2026.10.26"
    # On renomme les topics en noms d'index francophones et parlants.
    index => "%{[@metadata][index_base]}-%{+YYYY.MM.dd}"
  }
}
