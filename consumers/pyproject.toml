[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-consumers"
version = "0.1.0"
description = "Consumers Kafka : relevés → Redis (live), alertes → MongoDB"
requires-python = ">=3.11"
dependencies = [
    "kafka-python>=2.0",            # client Kafka
    "redis>=5.0",                   # consumer Redis
    "pymongo>=4.6",                 # consumer MongoDB
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
consume-redis = "consumers.redis_consumer:main"
consume-mongo = "consumers.mongo_consumer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
